name: 🚀 Feature Request
description: Suggest an idea or improvement for the BFFX framework
title: "feat: <title>"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make BFFX better? We would love to hear about it!
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of what the problem or limitation is (e.g., "I'm frustrated when...").
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the solution you'd like
      description: A clear and concise description of what you want to happen and how you envision the YAML/Go interface looking.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Describe alternatives you've considered
      description: Any alternative solutions or workarounds you've tried or thought of.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add any other context, screenshots, or code fragments about the feature request here.
