name: 🐛 Bug Report
description: File a bug report to help us improve BFFX
title: "bug: <title>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill in as much info as possible to help us debug and resolve the issue.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How do we trigger the issue? If possible, provide minimal YAML manifests or Go code snippets.
      placeholder: |
        1. Scaffold a new project using `bffx new app`
        2. Declare a resource in `bffx/resources/...`
        3. Run `bffx sync`
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected vs Actual Behavior
      description: What did you expect to happen, and what actually happened?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Command Output / Logs
      description: Run the command with verbose logs or paste the server stdout/stderr if applicable.
      render: shell
  - type: input
    id: version
    attributes:
      label: BFFX Version
      description: Run `bffx --help` or check `.bffx/framework_version` to identify the version.
      placeholder: v0.1.3-beta
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: OS / Environment
      description: What operating system, Go version, and storage driver (SQLite/Postgres) are you using?
      placeholder: macOS Sequoia, Go 1.26, SQLite
    validations:
      required: true
