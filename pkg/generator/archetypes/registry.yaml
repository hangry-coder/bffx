# BFFX Archetype Registry
# Maps CLI aliases to pre-configured project templates and pipeline setups.

archetypes:
  - name: notes
    description: "Reference CRUD application with screen builders, actions, and custom hooks."
    auth_strategy: optional
    layout: legacy
    minimal: false
    batteries:
      auth: builtin
      store: sqlite
      cache: memory
      blob: local
      analytics: noop
      observability: slog
      flags: bffx
      i18n: builtin
    runtime:
      redis: false
      worker: false
      streaming: false
    addons:
      monetization: false
      flags: true
      telemetry: false
      ads: false

  - name: superapp
    description: "Multi-service ecosystem with clerk auth, postgres, upstash + asynq, R2, and chatbot + RAG pipelines."
    auth_strategy: mandatory
    layout: v2
    minimal: false
    batteries:
      auth: clerk
      store: postgres
      cache: upstash
      blob: r2
      analytics: posthog
      observability: slog
      flags: bffx
      i18n: builtin
    runtime:
      redis: true
      worker: true
      worker_language: python
      streaming: true
    addons:
      monetization: true
      flags: true
      telemetry: true
      ads: true
    pipeline:
      type: chatbot
      name: Support
      feature: support

