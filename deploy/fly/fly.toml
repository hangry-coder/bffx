# Fly.io configuration for BFFX
app = "bffx-app"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[mounts]
  source = "bffx_data"
  destination = "/app/.bffx/data"
  initial_size = "1GB"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[env]
  BFFX_ENV = "production"
  PORT = "8080"
  BFFX_STORAGE_DRIVER = "sqlite"
  BFFX_STORAGE_PATH = "/app/.bffx/data/app.db"
