apiVersion: bffx.io/v1alpha1
kind: Resource
metadata:
  name: AppConfig
spec:
  group: mobile
  fields:
    - { name: key, type: string }
    - { name: value, type: string }
    - { name: type, type: string }
    - { name: description, type: string }
  routes:
    crud: true
  policy:
    read: public
    write: public
  hooks: {}
