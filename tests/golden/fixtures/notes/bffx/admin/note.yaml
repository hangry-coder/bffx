apiVersion: bffx.io/v1alpha1
kind: AdminResource
metadata:
  name: NoteAdmin
spec:
  resource: Note
  enabled: true
  menu:
    label: My Notes
    priority: 5
  index:
    per_page: 10
    default_sort: "created_at desc"
    columns:
      - title
      - created_at
    scopes:
      - name: all
        default: true
