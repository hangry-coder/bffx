apiVersion: bffx.io/v1alpha1
kind: Resource
metadata:
  name: Subscription
spec:
  group: system
  fields:
    - { name: user_id, type: string }
    - { name: plan_id, type: string }
    - { name: status, type: string }
    - { name: expires_at, type: string }
  routes:
    crud: true
  policy:
    read: owner
    write: owner
  hooks: {}
